<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Cài đặt Udemy Vietsub AI</title>
  <style>
    body { max-width: 560px; margin: 32px auto; padding: 0 16px; font: 14px/1.5 system-ui, sans-serif; color: #1c1d1f; }
    h1 { font-size: 20px; }
    label { display: block; font-weight: 600; margin-top: 16px; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font: inherit; }
    .hint { color: #6a6f73; font-size: 12px; font-weight: normal; }
    button { margin-top: 16px; padding: 8px 16px; border: 0; border-radius: 4px; background: #5624d0; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e8e8ea; color: #1c1d1f; }
    #msg { margin-left: 10px; color: #1e6055; }
    hr { margin: 28px 0; border: 0; border-top: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Udemy Vietsub AI — Cài đặt</h1>

  <label>DeepSeek API key
    <input type="password" id="apiKey" placeholder="sk-...">
    <span class="hint">Lấy ở platform.deepseek.com → API keys. Key chỉ lưu trong máy này.</span>
  </label>

  <label>Model
    <input type="text" id="model" placeholder="deepseek-chat">
    <span class="hint">Mặc định deepseek-chat. Để trống nếu không chắc.</span>
  </label>

  <button id="save">Lưu</button><span id="msg"></span>

  <hr>
  <div><b>Bản dịch đã lưu:</b> <span id="count">...</span></div>
  <button id="clear" class="secondary">Xoá toàn bộ bản dịch đã lưu</button>

  <script src="options.js"></script>
</body>
</html>
